[project]
name = "ciphersong"
version = "1.0.0"
description = "Plataforma de Repertório Musical, Escala Semanal e Músicas a Ensaiar em Equipe"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "CipherSong Studio", email = "contato@ciphersong.app" }
]
dependencies = [
    "flet>=1.0.0",
    "flet-audio-recorder>=1.0.0",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
    "pymongo>=4.8.0",
    "dnspython>=2.6.0",
    "certifi>=2024.0.0",
]

[project.optional-dependencies]
desktop = [
    "sounddevice>=0.5.0",
    "pymongo[srv]>=4.8.0",
    "python-dotenv>=1.0.0",
]
backend = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pymongo[srv]>=4.8.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.8.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.17.0",
]

[tool.flet]
org = "com.ciphersong"
product = "CipherSong"
company = "CipherSong Studio"
copyright = "Copyright (C) 2026 CipherSong"
permissions = ["microphone"]

[tool.flet.app]
path = "."
exclude = [
    ".env",
    ".git",
    ".agents",
    ".github",
    ".pytest_cache",
    "__pycache__",
    "tests",
    "backend_api.py",
    "agents_system.py",
    "CipherSong_Mobile.apk",
    "Build 0.1 (Test).apk",
    "builds",
    "android",
    "build_apk.ps1",
    "Dockerfile",
    "validar_email.py",
    "test_agents_system.py",
    ".ciphersong_vault.enc",
    "*.enc",
    "*.jks",
    "*.log",
]

[tool.flet.android]
adaptive_icon_background = "#1C1B20"

[tool.flet.android.permission]
"android.permission.RECORD_AUDIO" = true
"android.permission.MODIFY_AUDIO_SETTINGS" = true
"android.permission.INTERNET" = true
"android.permission.VIBRATE" = true
"android.permission.WAKE_LOCK" = true
"android.permission.POST_NOTIFICATIONS" = true
"android.permission.FOREGROUND_SERVICE" = true
"android.permission.FOREGROUND_SERVICE_DATA_SYNC" = true

[tool.flet.deep_linking]
scheme = "ciphersong"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning:fastapi.testclient",
]


